apiVersion: apps/v1

kind: Deployment

metadata:
  name: mini-project

spec:

  replicas: 2

  selector:
    matchLabels:
      app: mini-project

  template:

    metadata:
      labels:
        app: mini-project

    spec:

      containers:

      - name: mini-project

        image: 449592896220.dkr.ecr.us-east-1.amazonaws.com/mini_project:latest

        ports:

        - containerPort: 3000
