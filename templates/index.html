<!DOCTYPE html>
<html>

<head>

<title>Interview Readiness</title>

<style>

body{

background:#071c2c;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.card{

background:#13283c;
padding:40px;
border-radius:15px;
width:400px;

}

input,select{

width:100%;
padding:12px;
margin:10px 0;

}

button{

width:100%;
padding:12px;
background:linear-gradient(to right,#3da5ff,#7cff6c);

}

</style>

</head>

<body>

<div class="card">

<h1>Interview Ready Project 🚀</h1>

<p>Prepare for your dream role</p>

<form action="/result" method="post">

<input
name="name"
placeholder="Enter name"
required>

<select name="role">

<option>QA Automation</option>

<option>DevOps</option>

<option>Python</option>

<option>Testing</option>

</select>

<input
name="confidence"
placeholder="Confidence level (1-10)"
required>

<button>

Start Interview Journey

</button>

</form>

</div>

</body>

</html>
